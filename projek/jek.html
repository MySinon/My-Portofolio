<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projek — My Sinon 💼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Orbitron:wght@500;900&family=Yuji+Syuku&display=swap" rel="stylesheet" />

<style>
/* =========================================================
   RESET & VARIABLES
   ========================================================= */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sakura: #e8d8ff;
  --pink: #ec4899;
  --purple: #7c3aed;
  --maroon: #8b1e2d;
  --navy: #1e3a8a;
  --gold: #d4af37;
  --cyan: #06b6d4;
  --green: #4ade80;
  --bg-1: #120a1f;
  --text: #f5edff;
  --text-dim: #b8a8d0;
  --gradient: linear-gradient(135deg, #8b1e2d, #ec4899, #7c3aed);
  --gradient-warm: linear-gradient(135deg, #e8d8ff, #ec4899, #8b1e2d);
  --card-bg: rgba(30, 20, 45, 0.55);
  --card-border: rgba(139, 30, 45, 0.35);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-1);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
  position: relative;
  padding-top: 70px;
}

/* Background layers */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 20%, rgba(236, 72, 153, 0.2), transparent 45%),
    radial-gradient(circle at 85% 30%, rgba(124, 58, 237, 0.18), transparent 45%),
    radial-gradient(circle at 50% 90%, rgba(139, 30, 45, 0.12), transparent 50%);
  z-index: -3;
  animation: auroraShift 14s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes auroraShift {
  0%   { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg); }
  100% { transform: translate(-20px, -30px) scale(1.1); filter: hue-rotate(20deg); }
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(236, 72, 153, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  z-index: -2;
  pointer-events: none;
  mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 75%);
}

#sakura {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}
.petal {
  position: absolute;
  top: -30px;
  width: 12px;
  height: 12px;
  background: radial-gradient(circle at 30% 30%, #ffd9e2, #ffb7c5);
  border-radius: 50% 0 50% 0;
  opacity: 0.6;
  will-change: transform;
  animation: petalFall linear infinite;
}
@keyframes petalFall {
  0%   { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.6; }
  90%  { opacity: 0.6; }
  100% { transform: translate(var(--drift, 60px), 105vh) rotate(720deg); opacity: 0; }
}

/* =========================================================
   NAVBAR
   ========================================================= */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 16px 5vw;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: rgba(18, 10, 31, 0.7);
  border-bottom: 1px solid rgba(236, 72, 153, 0.15);
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--sakura);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 50px;
  border: 1px solid rgba(236, 72, 153, 0.4);
  background: rgba(236, 72, 153, 0.08);
  transition: all 0.3s;
}
.back-btn:hover {
  background: rgba(236, 72, 153, 0.2);
  box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
  transform: translateX(-3px);
}
.logo {
  font-family: 'Yuji Syuku', serif;
  font-weight: 700;
  font-size: 1.3rem;
  letter-spacing: 3px;
  color: var(--sakura);
  text-shadow: 0 0 15px var(--pink);
}
.logo span {
  background: var(--gradient-warm);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* =========================================================
   HERO
   ========================================================= */
.hero-page {
  padding: 60px 5vw 30px;
  text-align: center;
  position: relative;
}
.hero-page .jp {
  font-family: 'Yuji Syuku', serif;
  color: var(--sakura);
  letter-spacing: 10px;
  font-size: 0.9rem;
  opacity: 0.7;
  margin-bottom: 12px;
  display: block;
  animation: fadeInUp 0.8s ease both;
}
.hero-page h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(2rem, 6vw, 3.5rem);
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 1rem;
  text-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
  animation: fadeInUp 0.8s ease 0.15s both;
}
.hero-page h1 .gradient-text {
  background: linear-gradient(135deg, #e8d8ff, #ec4899, #8b1e2d, #ec4899, #e8d8ff);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradientShift 5s ease infinite;
}
@keyframes gradientShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.hero-page p.desc {
  max-width: 620px;
  margin: 0 auto;
  color: var(--text-dim);
  font-size: 1rem;
  line-height: 1.7;
  animation: fadeInUp 0.8s ease 0.3s both;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* =========================================================
   FILTER BAR
   ========================================================= */
.filter-bar {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 24px 5vw;
  animation: fadeInUp 0.8s ease 0.45s both;
}
.filter-btn {
  padding: 8px 20px;
  border-radius: 50px;
  border: 1px solid rgba(236, 72, 153, 0.35);
  background: rgba(236, 72, 153, 0.08);
  color: var(--text-dim);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.5px;
}
.filter-btn:hover {
  border-color: var(--pink);
  color: var(--sakura);
  transform: translateY(-2px);
  box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
}
.filter-btn.active {
  background: var(--gradient);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 0 25px rgba(236, 72, 153, 0.6);
  font-weight: 700;
}

/* =========================================================
   PROJECT GRID
   ========================================================= */
.projects-wrap {
  padding: 20px 5vw 100px;
  max-width: 1180px;
  margin: 0 auto;
}
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
}

.project-card {
  position: relative;
  padding: 22px 22px 24px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  overflow: hidden;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.35s, box-shadow 0.35s;
  opacity: 0;
  animation: cardReveal 0.6s ease forwards;
}
@keyframes cardReveal {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
.project-card:hover {
  transform: translateY(-6px);
  border-color: rgba(236, 72, 153, 0.7);
  box-shadow: 0 20px 50px rgba(236, 72, 153, 0.3),
              0 0 60px rgba(124, 58, 237, 0.2);
}
.project-card::after {
  content: '';
  position: absolute;
  top: 10px; right: 10px;
  width: 22px; height: 22px;
  border-top: 2px solid var(--pink);
  border-right: 2px solid var(--pink);
  opacity: 0.45;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 3;
}
.project-card:hover::after {
  top: 6px; right: 6px;
  opacity: 1;
  box-shadow: 0 0 10px var(--pink);
}

/* Thumbnail */
.pc-thumb {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 16px;
  border: 1px solid rgba(236, 72, 153, 0.3);
  background: linear-gradient(135deg, #1a0f2e, #2a1a45);
  transition: transform 0.4s, border-color 0.4s;
  display: block;
}
.project-card:hover .pc-thumb {
  transform: scale(1.03);
  border-color: rgba(236, 72, 153, 0.7);
}
.pc-thumb-placeholder {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  margin-bottom: 16px;
  border: 1px solid rgba(236, 72, 153, 0.3);
  background: linear-gradient(135deg, #1a0f2e, #2a1a45);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  opacity: 0.5;
}

.pc-head {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 14px;
}
.pc-icon {
  font-size: 2.2rem;
  filter: drop-shadow(0 0 12px rgba(236, 72, 153, 0.7));
  flex-shrink: 0;
  transition: transform 0.4s;
}
.project-card:hover .pc-icon {
  transform: scale(1.15) rotate(-8deg);
}
.pc-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 4px;
  line-height: 1.3;
}
.pc-meta {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}
.pc-desc {
  color: var(--text-dim);
  font-size: 0.88rem;
  line-height: 1.6;
  margin-bottom: 14px;
}
.pc-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.pc-tag {
  padding: 4px 12px;
  background: rgba(236, 72, 153, 0.1);
  border: 1px solid rgba(236, 72, 153, 0.3);
  border-radius: 50px;
  font-size: 0.72rem;
  color: #ffb7c5;
  letter-spacing: 0.3px;
}

.pc-status {
  position: absolute;
  top: 30px;
  right: 20px;
  padding: 3px 10px;
  border-radius: 50px;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  z-index: 2;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.pc-status.done {
  background: rgba(74, 222, 128, 0.2);
  border: 1px solid rgba(74, 222, 128, 0.6);
  color: var(--green);
}
.pc-status.wip {
  background: rgba(251, 191, 36, 0.2);
  border: 1px solid rgba(251, 191, 36, 0.6);
  color: #fbbf24;
}

/* =========================================================
   MODAL
   ========================================================= */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 5, 20, 0.9);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s, visibility 0.35s;
}
.modal-overlay.active { opacity: 1; visibility: visible; }

.modal {
  position: relative;
  width: 100%;
  max-width: 640px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 40px 34px;
  background: linear-gradient(160deg, rgba(35, 20, 55, 0.98), rgba(20, 10, 35, 0.98));
  border: 2px solid rgba(236, 72, 153, 0.5);
  border-radius: 22px;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7),
              0 0 80px rgba(236, 72, 153, 0.3);
  transform: perspective(1200px) rotateX(-20deg) scale(0.85) translateY(30px);
  opacity: 0;
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s;
}
.modal-overlay.active .modal {
  transform: perspective(1200px) rotateX(0) scale(1) translateY(0);
  opacity: 1;
}
.modal::-webkit-scrollbar { width: 6px; }
.modal::-webkit-scrollbar-thumb {
  background: var(--gradient-warm);
  border-radius: 10px;
}

.modal-close {
  position: absolute;
  top: 14px; right: 14px;
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(236, 72, 153, 0.5);
  background: rgba(236, 72, 153, 0.1);
  color: var(--text);
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s;
  display: grid;
  place-items: center;
  z-index: 2;
}
.modal-close:hover {
  background: var(--pink);
  transform: rotate(180deg) scale(1.1);
  box-shadow: 0 0 25px var(--pink);
}

.modal-img {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border-radius: 14px;
  border: 1px solid rgba(236, 72, 153, 0.4);
  margin-bottom: 18px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  display: block;
}

.modal h2 {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.5rem;
  margin-bottom: 0.4rem;
  background: var(--gradient-warm);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 1px;
  line-height: 1.3;
}
.modal .modal-icon {
  font-size: 2.8rem;
  margin-bottom: 8px;
  display: inline-block;
  filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.7));
}
.modal h3 {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.95rem;
  margin: 1.3rem 0 0.5rem;
  color: var(--cyan);
  letter-spacing: 1px;
  text-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
}
.modal p {
  color: var(--text-dim);
  line-height: 1.75;
  font-size: 0.95rem;
  margin-bottom: 0.6rem;
}
.modal ul { list-style: none; padding-left: 0; }
.modal li {
  color: var(--text-dim);
  padding: 8px 0 8px 24px;
  position: relative;
  font-size: 0.92rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
}
.modal li::before {
  content: '✿';
  position: absolute;
  left: 2px;
  color: var(--sakura);
  text-shadow: 0 0 10px var(--pink);
}
.modal .tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 0.8rem;
}
.modal .tag {
  padding: 6px 14px;
  background: rgba(236, 72, 153, 0.12);
  border: 1px solid rgba(236, 72, 153, 0.4);
  border-radius: 50px;
  font-size: 0.78rem;
  color: #ffb7c5;
}
.modal a.link {
  display: inline-block;
  margin-top: 0.5rem;
  color: var(--cyan);
  text-decoration: none;
  border-bottom: 1px dashed rgba(6, 182, 212, 0.5);
  transition: all 0.3s;
  font-size: 0.92rem;
}
.modal a.link:hover {
  color: var(--sakura);
  text-shadow: 0 0 12px var(--pink);
}

/* =========================================================
   FOOTER
   ========================================================= */
.footer {
  text-align: center;
  padding: 30px 20px;
  color: var(--text-dim);
  font-size: 0.8rem;
  border-top: 1px solid rgba(236, 72, 153, 0.15);
  letter-spacing: 1px;
}
.footer .jp {
  font-family: 'Yuji Syuku', serif;
  color: var(--sakura);
  letter-spacing: 4px;
  margin-bottom: 6px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 640px) {
  body { padding-top: 62px; }
  .navbar { padding: 12px 4vw; }
  .logo { font-size: 1.1rem; }
  .back-btn { font-size: 0.8rem; padding: 6px 12px; }
  .hero-page { padding: 40px 5vw 20px; }
  .projects-wrap { padding: 10px 5vw 60px; }
  .projects-grid { grid-template-columns: 1fr; gap: 18px; }
  .modal { padding: 30px 22px; }
  .modal h2 { font-size: 1.25rem; }
  .filter-bar { padding: 18px 4vw; }
  .filter-btn { padding: 6px 14px; font-size: 0.78rem; }
}
</style>
</head>
<body>

<!-- SAKURA -->
<div id="sakura"></div>

<!-- ============ NAVBAR ============ -->
<nav class="navbar">
  <a href="/" class="back-btn">← Kembali</a>
  <div class="logo">My<span>Sinon</span></div>
</nav>

<!-- ============ HERO ============ -->
<header class="hero-page">
  <span class="jp">プロジェクト</span>
  <h1><span class="gradient-text">PROJEK</span> 💼</h1>
  <p class="desc">
    Kumpulan karya dan eksperimen yang pernah aku kerjakan — dari infrastruktur server,
    aplikasi web, sampai perancangan jaringan. Setiap projek punya cerita sendiri ✨
  </p>
</header>

<!-- ============ FILTER ============ -->
<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-filter="all">Semua</button>
  <button class="filter-btn" data-filter="web">🌐 Web</button>
  <button class="filter-btn" data-filter="server">🖥️ Server</button>
  <button class="filter-btn" data-filter="network">🔗 Network</button>
</div>

<!-- ============ PROJECTS GRID ============ -->
<main class="projects-wrap">
  <div class="projects-grid" id="projectsGrid"></div>
</main>

<!-- ============ MODAL ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ============ FOOTER ============ -->
<footer class="footer">
  <p class="jp">ありがとう ございます</p>
  <p>© 2026 My Sinon — my-sinon.my.id/projek — Made with 💜🌸</p>
</footer>

<script>
/* =========================================================
   DATA PROJEK
   ========================================================= */
const PROJECTS = [
  {
    id: 'server-infra',
    icon: '🖥️',
    title: 'Pemahaman Server & Infrastruktur',
    category: 'server',
    year: '2023',
    status: 'done',
    img: 'img/server.png',
    short: 'Familiar dengan Windows Server, Linux (Ubuntu/Debian), virtualisasi (VMware/VirtualBox), serta layanan DNS, DHCP, dan web server sederhana.',
    desc: 'Praktik dasar infrastruktur server selama sekolah — setup Windows Server & Linux (Ubuntu/Debian) di dalam virtual machine, konfigurasi layanan dasar seperti DNS, DHCP, dan web server.',
    highlights: [
      'Install & konfigurasi Windows Server',
      'Setup Linux Ubuntu & Debian',
      'Virtualisasi pakai VMware & VirtualBox',
      'Konfigurasi DNS, DHCP, web server',
      'Praktik dasar administrasi server'
    ],
    tech: ['Debian', 'VirtualBox', 'Server'],
    link: null
  },
  {
    id: 'oaa',
    icon: '📋',
    title: 'OAA Application',
    category: 'web',
    year: '2024',
    status: 'done',
    img: 'img/oaa.png',
    short: 'Aplikasi berbasis Web dan terintegritas database, untuk menganalisis perkembangan sisw/i, di lengkapi dengan AI yang canggih.',
    desc: 'Aplikasi berbasis web dengan integrasi database untuk menganalisis perkembangan siswa. Dilengkapi fitur AI untuk membantu analisis data dan memberikan insight otomatis.',
    highlights: [
      'Manajemen data siswa',
      'Analisis perkembangan siswa',
      'Integrasi database',
      'Fitur AI untuk analisis otomatis',
      'Dashboard interaktif'
    ],
    tech: ['HTML', 'Firebase', 'AI'],
    link: null
  },
  {
    id: 'jaringan',
    icon: '🌐',
    title: 'Perancangan & Simulasi Jaringan',
    category: 'network',
    year: '2023',
    status: 'done',
    img: 'img/jaringan.png',
    short: 'Mengkonfigurasi Router Mikrotik yang terhubung antar LAN, server DMZ, switch manageble dan client.',
    desc: 'Perancangan topologi jaringan dan simulasi jaringan menggunakan Router Mikrotik. Konfigurasi routing antar LAN, DMZ, switch manageble, dan client.',
    highlights: [
      'Konfigurasi Router Mikrotik',
      'Routing antar LAN',
      'Setup server DMZ',
      'Konfigurasi switch manageble',
      'Simulasi topologi jaringan (Cisco)'
    ],
    tech: ['Cisco', 'Mikrotik', 'DMZ'],
    link: null
  },
  {
    id: 'server-hp',
    icon: '📱',
    title: 'Server Fisik dari HP Android',
    category: 'server',
    year: '2025',
    status: 'done',
    img: 'img/server-hp.png',
    short: 'Eksperimen bikin server fisik pakai HP Android bekas — jadi web server lokal untuk testing project.',
    desc: 'Eksperimen mengubah HP Android bekas menjadi server fisik yang berfungsi sebagai web server untuk keperluan testing project pribadi.',
    highlights: [
      'Install Linux (Termux) di Android',
      'Setup web server di HP',
      'Remote access via SSH',
      'Hosting mini untuk testing project',
      'Konsumsi daya rendah'
    ],
    tech: ['Termux', 'Linux', 'Server'],
    link: null
  }
];

/* =========================================================
   RENDER PROJECT CARDS
   ========================================================= */
const grid = document.getElementById('projectsGrid');

function renderProjects(filter = 'all') {
  grid.innerHTML = '';
  const filtered = filter === 'all'
    ? PROJECTS
    : PROJECTS.filter(p => p.category === filter);

  if (filtered.length === 0) {
    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 40px;">Belum ada projek di kategori ini 🌸</p>';
    return;
  }

  filtered.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.style.animationDelay = (i * 0.08) + 's';
    card.dataset.id = p.id;

    const thumb = p.img
      ? `<img class="pc-thumb" src="${p.img}" alt="${p.title}" onerror="this.outerHTML='<div class=&quot;pc-thumb-placeholder&quot;>${p.icon}</div>'">`
      : `<div class="pc-thumb-placeholder">${p.icon}</div>`;

    card.innerHTML = `
      ${thumb}
      <span class="pc-status ${p.status === 'done' ? 'done' : 'wip'}">
        ${p.status === 'done' ? '✅ Done' : '🚧 WIP'}
      </span>
      <div class="pc-head">
        <div class="pc-icon">${p.icon}</div>
        <div>
          <div class="pc-title">${p.title}</div>
          <div class="pc-meta">${p.year} • ${p.category.toUpperCase()}</div>
        </div>
      </div>
      <p class="pc-desc">${p.short}</p>
      <div class="pc-tags">
        ${p.tech.slice(0, 4).map(t => `<span class="pc-tag">${t}</span>`).join('')}
        ${p.tech.length > 4 ? `<span class="pc-tag">+${p.tech.length - 4}</span>` : ''}
      </div>
    `;

    card.addEventListener('click', () => openModal(p.id));
    grid.appendChild(card);
  });
}

/* =========================================================
   FILTER LOGIC
   ========================================================= */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProjects(btn.dataset.filter);
  });
});

/* =========================================================
   MODAL
   ========================================================= */
const overlay = document.getElementById('modalOverlay');
const modalBody = document.getElementById('modalBody');

function openModal(id) {
  const p = PROJECTS.find(x => x.id === id);
  if (!p) return;

  const modalImg = p.img
    ? `<img class="modal-img" src="${p.img}" alt="${p.title}" onerror="this.style.display='none'">`
    : '';

  modalBody.innerHTML = `
    ${modalImg}
    <span class="modal-icon">${p.icon}</span>
    <h2>${p.title}</h2>
    <p style="font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 1rem;">
      ${p.year} • ${p.category.toUpperCase()}
    </p>
    <p>${p.desc}</p>

    <h3>✨ Highlight</h3>
    <ul>
      ${p.highlights.map(h => `<li>${h}</li>`).join('')}
    </ul>

    <h3>🧠 Tech Stack</h3>
    <div class="tag-list">
      ${p.tech.map(t => `<span class="tag">${t}</span>`).join('')}
    </div>

    ${p.link ? `<h3>🔗 Link</h3><a class="link" href="${p.link}" target="_blank" rel="noopener">Kunjungi ${p.link.replace('https://', '')} →</a>` : ''}
  `;

  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* =========================================================
   SAKURA PETALS
   ========================================================= */
(function initSakura() {
  const container = document.getElementById('sakura');
  const isMobile = window.innerWidth < 768;
  const count = isMobile ? 10 : 20;

  for (let i = 0; i < count; i++) {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.style.left = Math.random() * 100 + 'vw';
    petal.style.animationDuration = (12 + Math.random() * 8) + 's';
    petal.style.animationDelay = Math.random() * 12 + 's';
    petal.style.setProperty('--drift', (Math.random() * 120 - 40) + 'px');
    petal.style.transform = `rotate(${Math.random() * 360}deg)`;
    if (Math.random() > 0.5) {
      petal.style.background = 'radial-gradient(circle at 30% 30%, #e0d0ff, #a855f7)';
    }
    container.appendChild(petal);
  }
})();

/* =========================================================
   INIT
   ========================================================= */
renderProjects();
</script>
</body>
